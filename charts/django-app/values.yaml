image:
  repository: "034255117140.dkr.ecr.eu-central-1.amazonaws.com/django-app-gitops"
  tag: 34
  pullPolicy: Always

replicaCount: 1

containerPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

pdb:
  enabled: true
  maxUnavailable: 1

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
