{{- if .Values.applications.django.enabled }}

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: {{ .Values.applications.django.name }}
  namespace: argocd

spec:
  project: default

  source:
    repoURL: {{ .Values.applications.django.repoURL }}
    targetRevision: {{ .Values.applications.django.targetRevision }}
    path: {{ .Values.applications.django.path }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.applications.django.namespace }}

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

{{- end }}
